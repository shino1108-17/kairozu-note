<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="実験レポート用の回路図をグリッド上で組み立て、シミュレーションして、PNG・SVG で書き出せるブラウザ上の回路図エディタ。">
<title>回路図ノート</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Cpath d='M0 22H10M34 22H44' stroke='black' stroke-width='4'/%3E%3Crect x='10' y='14' width='24' height='16' stroke='black' stroke-width='4' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: lab-notebook workbench. Parts list left, paper-white drawing sheet in the middle, properties / simulation right,
   waveform panel slides up under the sheet. Monochrome by design: black type and strokes on Paper, hairline structure,
   pill controls, one filled button (書き出し). Graph traces are told apart by dash pattern so they survive B/W printing. */
:root{
  --obsidian:#000000;
  --graphite:#666666;
  --smoke:#8f8f8f;
  --paper:#ffffff;
  --ash:#f1f1f1;
  --hairline:#0000001f;
  --whisper:#0000000a;
  --scrim:#00000029;
  --grid-dot:#0000002e;
  --shadow-sm:rgba(0,0,0,.02) 0 4px 6px 0, rgba(0,0,0,.05) 0 0 2px 0;
  --shadow-float:rgba(0,0,0,.04) 0 8px 24px 0, rgba(0,0,0,.06) 0 0 2px 0;
  --font-ui:'Inter','Noto Sans JP',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r-pill:9999px;
  --r-card:6px;
  --r-link:4px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--obsidian);font-family:var(--font-ui);font-size:14px;
  font-feature-settings:'calt' 1,'liga' 1;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--obsidian);outline-offset:2px}

#app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);
  display:grid;grid-template-rows:60px minmax(0,1fr)}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 16px 0 20px;
  border-bottom:1px solid var(--hairline);background:var(--paper);min-width:0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{font-size:15px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.mark svg{flex:none}
.title-input{border:1px solid transparent;background:transparent;border-radius:var(--r-pill);height:34px;padding:0 14px;
  font-size:14px;font-weight:500;color:var(--graphite);width:min(320px,30vw);min-width:0}
.title-input:hover{background:var(--whisper)}
.title-input:focus{outline:none;border-color:var(--hairline);background:var(--paper);color:var(--obsidian)}
.top-actions{display:flex;align-items:center;gap:4px;flex:none}

.btn{height:36px;padding:0 18px;border-radius:var(--r-pill);border:1px solid transparent;background:transparent;
  font-size:14px;font-weight:500;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;white-space:nowrap;transition:background .15s, box-shadow .15s, opacity .15s}
.btn.ghost:hover{background:var(--whisper)}
.btn.pill{border-color:var(--hairline)}
.btn.pill:hover{box-shadow:var(--shadow-sm);background:var(--paper)}
.btn.pill.strong{border-color:var(--obsidian)}
.btn.filled{background:var(--obsidian);color:var(--paper)}
.btn.filled:hover{opacity:.82}
.btn.sm{height:32px;padding:0 14px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--ash)}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none}
.only-narrow{display:none!important}

/* ---------- workspace ---------- */
.work{display:grid;grid-template-columns:252px minmax(0,1fr) 304px;min-height:0;position:relative}
.side{background:var(--paper);overflow-y:auto;overscroll-behavior:contain;min-height:0}
.side-left{border-right:1px solid var(--hairline);padding:16px 14px 32px}
.side-right{border-left:1px solid var(--hairline);padding:16px 20px 40px}
.rtabs{margin-bottom:22px}

.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}
.search input{width:100%;height:38px;border:1px solid var(--hairline);border-radius:var(--r-pill);background:transparent;
  padding:0 14px 0 38px;font-size:16px;letter-spacing:-0.01em}
.search input::placeholder{color:var(--graphite)}
.search input:focus{outline:none;border-color:#00000052}

.eyebrow{font-size:13px;font-weight:500;color:var(--graphite);letter-spacing:.01em}
.pal-group{margin-top:22px;display:grid;gap:8px}
.pal-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.pal-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 9px;border:0;background:transparent;
  border-radius:var(--r-card);cursor:pointer;text-align:center;font-size:13px;font-weight:500;line-height:1.3}
.pal-item:hover{background:var(--whisper)}
.pal-item[aria-pressed="true"]{background:var(--ash)}
.pal-item svg{width:64px;height:34px;overflow:visible}
.pal-item svg *{vector-effect:non-scaling-stroke;stroke-width:1.35px}
.pal-item svg .thick{stroke-width:3.2px}
.pal-item span{color:var(--obsidian);word-break:keep-all;overflow-wrap:anywhere}
.empty{color:var(--graphite);font-size:13px;margin:24px 4px}

/* ---------- stage ---------- */
.stage{--plot-h:0px;position:relative;overflow:hidden;background-color:var(--paper);
  background-image:radial-gradient(circle,var(--grid-dot) 1px,transparent 1.4px);min-width:0}
.stage.with-plot{--plot-h:min(330px,48%)}
.stage.nogrid{background-image:none}
#svg{position:absolute;left:0;top:0;width:100%;height:calc(100% - var(--plot-h));touch-action:none;user-select:none;-webkit-user-select:none;display:block}
.hint{position:absolute;left:16px;top:14px;right:16px;pointer-events:none;display:flex}
.hint span{background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-pill);padding:6px 14px;
  font-size:13px;line-height:1.51;color:var(--graphite);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint b{color:var(--obsidian);font-weight:500}

.toolbar{position:absolute;left:50%;bottom:calc(var(--plot-h) + 18px);transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:5px;
  background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r-pill);box-shadow:var(--shadow-float);
  max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none;z-index:2}
.toolbar::-webkit-scrollbar{display:none}
.tbtn{height:34px;min-width:34px;padding:0 14px;border:0;border-radius:var(--r-pill);background:transparent;cursor:pointer;
  font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;flex:none}
.tbtn:hover{background:var(--whisper)}
.tbtn[aria-pressed="true"]{background:var(--ash)}
.tbtn.icon{padding:0;width:34px}
.tbtn:disabled{opacity:.3;cursor:default;background:transparent}
.tbtn kbd{font-family:var(--font-mono);font-size:11px;color:var(--smoke);font-weight:400}
.tsep{width:1px;height:20px;background:var(--hairline);margin:0 4px;flex:none}
#zoom-label{min-width:54px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--graphite);padding:0 6px}
#btn-finish{background:var(--ash)}

.tip{position:absolute;pointer-events:none;background:var(--paper);border:1px solid var(--hairline);box-shadow:var(--shadow-sm);
  border-radius:var(--r-card);padding:8px 12px;font-size:13px;line-height:1.55;font-variant-numeric:tabular-nums;z-index:4;white-space:nowrap}
.tip b{font-weight:500}
.tip .mut{color:var(--graphite)}

/* ---------- waveform panel ---------- */
.plot{position:absolute;left:0;right:0;bottom:0;height:var(--plot-h);background:var(--paper);border-top:1px solid var(--hairline);
  display:flex;flex-direction:column;z-index:3}
.plot-head{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;padding:10px 16px 2px;flex-wrap:wrap}
.plot-title{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.plot-title b{font-size:14px;font-weight:500}
.stale{font-size:13px;color:var(--graphite)}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:6px 16px 0;align-items:center}
.lg-x{font-size:13px;color:var(--graphite);font-variant-numeric:tabular-nums;min-width:96px}
.lg{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 4px 0 10px;border:1px solid var(--hairline);border-radius:var(--r-pill);font-size:13px;font-weight:500}
.lg svg{flex:none}
.lg-val{color:var(--graphite);font-variant-numeric:tabular-nums;font-weight:400}
.lg button{border:0;background:transparent;width:22px;height:22px;border-radius:50%;cursor:pointer;color:var(--smoke);font-size:15px;line-height:1;padding:0}
.lg button:hover{background:var(--whisper);color:var(--obsidian)}
.plot-body{flex:1;min-height:0;position:relative}
#plot-svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- properties ---------- */
#props,#simpanel{display:grid;gap:28px}
.pgroup{display:grid;gap:12px}
.pgroup h2{margin:0;font-size:18px;font-weight:500;letter-spacing:-0.01em;line-height:1.32}
.field{display:grid;gap:6px;min-width:0}
.field>span,.flabel{font-size:13px;font-weight:500;color:var(--graphite)}
.field input,.field select{height:38px;border:1px solid var(--hairline);border-radius:var(--r-pill);padding:0 16px;background:var(--paper);
  font-size:16px;letter-spacing:-0.01em;width:100%;min-width:0}
.field select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--graphite) 50%),linear-gradient(135deg,var(--graphite) 50%,transparent 50%);
  background-position:calc(100% - 20px) 17px,calc(100% - 15px) 17px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.field input:focus,.field select:focus{outline:none;border-color:#00000052}
.field input[type=range]{height:24px;border:0;padding:0;accent-color:var(--obsidian)}
.field small{font-size:13px;color:var(--smoke);line-height:1.51}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid3 .field input{padding:0 10px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:28px;padding:0 12px;border:1px solid var(--hairline);border-radius:var(--r-pill);background:transparent;font-size:13px;font-weight:500;cursor:pointer}
.chip:hover{background:var(--whisper)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg-btn{height:32px;padding:0 14px;border:1px solid var(--hairline);border-radius:var(--r-pill);background:transparent;cursor:pointer;
  font-size:13px;font-weight:500;color:var(--graphite)}
.seg-btn:hover{background:var(--whisper)}
.seg-btn[aria-pressed="true"]{background:var(--ash);border-color:transparent;color:var(--obsidian)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;cursor:pointer;line-height:1.4}
.check input{width:16px;height:16px;accent-color:var(--obsidian);margin:0;flex:none}
.note{font-size:13px;line-height:1.51;color:var(--graphite);margin:0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-size:13px;margin:0}
.keys dt{white-space:nowrap}
.keys dd{margin:0;color:var(--graphite)}
kbd.k{font-family:var(--font-mono);font-size:12px;border:1px solid var(--hairline);border-radius:var(--r-link);padding:1px 6px;background:var(--paper);color:var(--obsidian)}

.msg{font-size:13px;line-height:1.55;padding:10px 14px;border-radius:var(--r-card);border:1px solid var(--hairline);margin:0}
.msg b{font-weight:600}
.msg.err{border-color:var(--obsidian)}
.meters{display:grid;gap:8px}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 14px;border:1px solid var(--hairline);border-radius:var(--r-card);cursor:pointer}
.meter-row:hover{background:var(--whisper)}
.meter-row span{font-size:13px;font-weight:500;color:var(--graphite)}
.meter-row b{font-size:22px;font-weight:500;letter-spacing:-0.01em;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;margin:0 -4px}
.restable{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;line-height:1.45}
.restable th{color:var(--graphite);font-weight:500;text-align:left;padding:6px 4px;border-bottom:1px solid var(--hairline);white-space:nowrap}
.restable td{padding:7px 4px;border-bottom:1px solid var(--hairline);vertical-align:top}
.restable td.num,.restable th.num{text-align:right;white-space:nowrap}
.restable tr[data-id]{cursor:pointer}
.restable tr[data-id]:hover td{background:var(--whisper)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:var(--paper);border-radius:var(--r-card);border:1px solid var(--hairline);box-shadow:var(--shadow-float);
  width:min(920px,100%);max-height:calc(100% - 16px);overflow:auto;padding:24px}
.sheet.narrow{width:min(420px,100%)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.sheet-head h2{margin:0;font-size:22px;font-weight:500;letter-spacing:-0.01em;line-height:1.26}
.ex-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.ex-preview{border:1px solid var(--hairline);border-radius:var(--r-card);min-height:260px;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--paper)}
.ex-preview.clear{background-color:var(--paper);background-image:conic-gradient(var(--ash) 25%,transparent 0 50%,var(--ash) 0 75%,transparent 0);background-size:16px 16px}
.ex-preview img{max-width:100%;max-height:52vh;display:block}
.ex-opts{display:grid;gap:18px}
.ex-size{font-size:13px;color:var(--graphite);font-variant-numeric:tabular-nums;margin:0;line-height:1.51}
.ex-actions{display:grid;gap:8px}
.ex-actions .btn{width:100%}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--obsidian);color:var(--paper);
  padding:10px 18px;border-radius:var(--r-pill);font-size:14px;font-weight:500;z-index:30;max-width:calc(100% - 32px);text-align:center;line-height:1.4}

#measure{position:absolute;left:-10000px;top:0;width:10px;height:10px;visibility:hidden}

/* ---------- narrow screens ---------- */
@media (max-width:900px){
  .work{grid-template-columns:minmax(0,1fr)}
  .side{position:absolute;top:0;bottom:0;z-index:6;width:min(320px,90vw);transition:transform .22s ease;box-shadow:var(--shadow-float)}
  .side-left{left:0;transform:translateX(-102%)}
  .side-right{right:0;transform:translateX(102%)}
  .side.open{transform:none}
  .only-narrow{display:inline-flex!important}
  .pgroup.only-narrow{display:grid!important}
  .wide-only{display:none!important}
  .ex-body{grid-template-columns:minmax(0,1fr)}
  .stage.with-plot{--plot-h:52%}
}
@media (max-width:560px){
  .title-input{display:none}
  .top{padding:0 12px 0 16px}
  .btn{padding:0 14px}
  .toolbar{bottom:calc(var(--plot-h) + 12px)}
  .tbtn kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand">
      <span class="mark">
        <svg width="22" height="14" viewBox="0 0 44 28" aria-hidden="true"><path d="M0 14H10M34 14H44" stroke="currentColor" stroke-width="3" fill="none"/><rect x="10" y="6" width="24" height="16" stroke="currentColor" stroke-width="3" fill="none"/></svg>
        回路図ノート
      </span>
      <input id="doc-title" class="title-input" placeholder="無題の回路図" aria-label="図の名前" autocomplete="off">
    </div>
    <div class="top-actions">
      <button class="btn ghost only-narrow" id="btn-parts" type="button">部品</button>
      <button class="btn ghost only-narrow" id="btn-props" type="button">設定</button>
      <button class="btn ghost wide-only" id="btn-new" type="button">新規</button>
      <button class="btn ghost wide-only" id="btn-open" type="button">開く</button>
      <button class="btn ghost wide-only" id="btn-save" type="button">保存</button>
      <button class="btn filled" id="btn-export" type="button">書き出し</button>
    </div>
    <input type="file" id="file-input" accept=".json,application/json" hidden>
  </header>

  <main class="work">
    <aside class="side side-left" id="side-left" aria-label="部品">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="#000" stroke-width="1.4" fill="none"/><path d="M11 11L14.5 14.5" stroke="#000" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="part-search" type="search" placeholder="部品を検索" aria-label="部品を検索" autocomplete="off">
      </div>
      <div id="palette"></div>
    </aside>

    <section class="stage" id="stage">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" aria-label="回路図キャンバス">
        <g id="viewport"><g id="content"></g><g id="overlay" pointer-events="none"></g></g>
      </svg>
      <div class="hint"><span id="hint"></span></div>
      <div class="tip" id="tip" hidden></div>
      <div class="toolbar" role="toolbar" aria-label="ツール">
        <button class="tbtn" data-tool="select" type="button" aria-pressed="true">選択 <kbd>V</kbd></button>
        <button class="tbtn" data-tool="wire" type="button" aria-pressed="false">配線 <kbd>W</kbd></button>
        <button class="tbtn" data-tool="text" type="button" aria-pressed="false">文字 <kbd>T</kbd></button>
        <button class="tbtn" id="btn-finish" type="button" hidden>配線を終了</button>
        <span class="tsep"></span>
        <button class="tbtn" id="btn-run" type="button" title="シミュレーションを実行 (⌘/Ctrl+Enter)">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.5L10 6L2.5 10.5Z" fill="#000"/></svg>実行</button>
        <span class="tsep"></span>
        <button class="tbtn icon" id="btn-undo" type="button" aria-label="元に戻す" title="元に戻す (⌘/Ctrl+Z)">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5L2.5 6.5L5.5 9.5M3 6.5H10A3.5 3.5 0 0 1 10 13.5H7" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tbtn icon" id="btn-redo" type="button" aria-label="やり直す" title="やり直す (⌘/Ctrl+Shift+Z)">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 3.5L13.5 6.5L10.5 9.5M13 6.5H6A3.5 3.5 0 0 0 6 13.5H9" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="tsep"></span>
        <button class="tbtn icon" id="btn-zout" type="button" aria-label="縮小">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8H13" stroke="#000" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button class="tbtn" id="zoom-label" type="button" title="100% に戻す">100%</button>
        <button class="tbtn icon" id="btn-zin" type="button" aria-label="拡大">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8H13M8 3V13" stroke="#000" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button class="tbtn" id="btn-fit" type="button" title="全体を表示 (0)">全体</button>
      </div>

      <div class="plot" id="plot" hidden>
        <div class="plot-head">
          <div class="plot-title"><b id="plot-title">DC スイープ</b><span class="stale" id="plot-stale" hidden>回路が変更されています。もう一度実行すると反映されます。</span></div>
          <div class="row">
            <button class="btn pill sm" id="plot-probe" type="button" aria-pressed="true" title="回路の線や部品をクリックしてグラフに追加 (P)">プローブ</button>
            <button class="btn ghost sm" id="plot-csv" type="button">CSV</button>
            <button class="btn ghost sm" id="plot-png" type="button">グラフ画像</button>
            <button class="btn ghost sm" id="plot-close" type="button">閉じる</button>
          </div>
        </div>
        <div class="legend" id="plot-legend"></div>

function head(tx, ty, dx, dy, len = 7, w = 3.2) {
  const L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, bx = tx - ux * len, by = ty - uy * len;
  return `<path d="M${f(tx)} ${f(ty)}L${f(bx - uy * w)} ${f(by + ux * w)}L${f(bx + uy * w)} ${f(by - ux * w)}Z" fill="#000" stroke="none"/>`;
}
function arrow(x1, y1, x2, y2, len = 7) {
  const L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  return `<path d="M${x1} ${y1}L${f(x2 - ux * (len - 1))} ${f(y2 - uy * (len - 1))}"/>` + head(x2, y2, x2 - x1, y2 - y1, len, len * 0.45);
}
const hump = (n, dx, dy, sweep) => Array(n).fill(`a6 6 0 0 ${sweep} ${dx} ${dy}`).join('');

function richText(str, size, auto) {
  str = String(str ?? '');
  const segs = [];
  const am = auto && str.match(/^([A-Za-z]+)(\d+)$/);
  if (am) segs.push([am[1], 0], [am[2], 1]);
  else {
    const re = /_\{([^}]*)\}|_([^\s_]+)/g; let last = 0, mm;
    while ((mm = re.exec(str))) {
      if (mm.index > last) segs.push([str.slice(last, mm.index), 0]);
      segs.push([mm[1] ?? mm[2], 1]); last = re.lastIndex;
    }
    if (last < str.length) segs.push([str.slice(last), 0]);
  }
  const d = f(size * 0.3), fs2 = f(size * 0.7);
  let out = '', down = false;
  for (const [t, sub] of segs) {
    if (sub && !down) { out += `<tspan dy="${d}" font-size="${fs2}">${esc(t)}</tspan>`; down = true; }
    else if (sub) out += `<tspan font-size="${fs2}">${esc(t)}</tspan>`;
    else if (down) { out += `<tspan dy="${-d}">${esc(t)}</tspan>`; down = false; }
    else out += esc(t);
  }
  return out;
}

function blankDoc() { return { app: 'kairozu-note', v: 2, title: '', settings: { ...DEFAULT_SETTINGS }, sim: { ...DEFAULT_SIM }, comps: [], wires: [], texts: [] }; }
function newComp(type, x, y, rot, label, value, extra = {}) {
  const d = DEFS[type];
  return { id: uid(), type, x, y, rot, flip: false, label, value, sym: d.sym, pol: d.pol, lp: 'auto', lo: null, on: false, sp: {}, ...extra };
}
function normalize(o) {
  const d = blankDoc();

  d.settings = { ...DEFAULT_SETTINGS, ...(o.settings || {}) };

const VT = 0.025852, GMIN = 1e-12, AOL = 1e5;
const expL = x => x < 40 ? Math.exp(x) : Math.exp(40) * (1 + x - 40);

}

}

function bjtF(beta, pnp) {

    const ic = Is * (ef - er) - Is / bR * (er - 1) + GMIN * (vbe - vbc);
    const ib = Is / beta * (ef - 1) + Is / bR * (er - 1) + GMIN * (vbe + vbc);

function mosF(vth, K, pmos) {

  let lo = 0, hi = xs.length - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if ((xs[mid] < xv) === asc) lo = mid; else hi = mid; }
  for (const i of [lo, hi]) { const d = Math.abs(xs[i] - xv); if (d < bd) { bd = d; best = i; } }
  const x = f(L.sx(xs[best]));
  let m = `<line x1="${x}" x2="${x}" y1="${L.panels[0].y0}" y2="${L.yb}" stroke="#000" stroke-opacity=".35" stroke-dasharray="3 3"/>`;
  for (const p of L.panels) for (const t of p.trs) { const v = t.vals[best]; if (isFinite(v)) m += `<circle cx="${x}" cy="${f(p.sy(v))}" r="4" fill="#fff" stroke="#000" stroke-width="1.5"/>`; }
  $('#plot-hover').innerHTML = m; renderLegend(best);
});
$('#plot-svg').addEventListener('pointerleave', () => { const h = $('#plot-hover'); if (h) h.innerHTML = ''; if (simRes && simRes.kind !== 'op') renderLegend(null); });
$('#plot-probe').addEventListener('click', () => setTool(tool === 'probe' ? 'select' : 'probe'));
$('#plot-close').addEventListener('click', () => { closePlot(); });
$('#plot-csv').addEventListener('click', () => {
  if (!simRes || !plot.traces.length) { toast('グラフに線がありません'); return; }
  const head = [`${simRes.xName} [${simRes.xUnit}]`, ...plot.traces.map(t => `${t.name} [${t.unit}]`)];
  const q = s => /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  const rows = simRes.xs.map((x, i) => [x, ...plot.traces.map(t => t.vals[i])].map(v => isFinite(v) ? Number(v.toPrecision(8)) : '').join(','));
  saveFile(`${fileBase()}-${simRes.kind === 'dc' ? 'DCスイープ' : '過渡解析'}.csv`, '﻿' + [head.map(q).join(','), ...rows].join('\r\n'));
});
$('#plot-png').addEventListener('click', async () => {
  if (!simRes || !plot.traces.length) { toast('グラフに線がありません'); return; }
  const groups = new Set(plot.traces.map(t => t.unit)).size || 1;
  const W = 820, H = 90 + groups * 250;
  const s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W * 2}" height="${H * 2}" viewBox="0 0 ${W} ${H}">${chartMarkup(W, H, true)}</svg>`;
  try { const blob = await svgToPng(s, W * 2, H * 2, 192); saveFile(`${fileBase()}-グラフ.png`, blob); } catch (_) { toast('グラフ画像を作れませんでした'); }
});
new ResizeObserver(() => renderPlot()).observe($('#plot-body'));

/* ================= files, export ================= */
const dlReady = (window.claude && typeof window.claude.use === 'function') ? Promise.resolve(window.claude.use('downloads')).catch(() => null) : Promise.resolve(null);
const fileBase = () => (doc.title.trim() || '回路図').replace(/[\\/:*?"<>|\n\r]+/g, '_').slice(0, 80);
async function saveFile(name, data) {
  const dl = await dlReady;
  if (dl) {
    try { await dl.save({ filename: name, data }); toast(`${name} を保存しました`); }
    catch (err) { const code = err && err.code; if (code === 'declined') return; toast(code === 'rate_limited' ? '保存の確認が開いています。少し待ってから再度お試しください' : '保存できませんでした。画像のコピーをお試しください'); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: 'application/octet-stream' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function saveJSON() { saveFile(fileBase() + '.json', JSON.stringify(doc, null, 1)); }
$('#file-input').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const o = JSON.parse(await file.text());
    if (!o || !Array.isArray(o.comps) || !Array.isArray(o.wires)) throw new Error('shape');
    doc = normalize(o); sel.clear(); draft = null; clearSim(); setTool('select'); commit(); renderPalette(); syncTitle(); requestAnimationFrame(fit);
    toast(`${file.name} を開きました`);
  } catch (_) { toast('回路図ノートで保存した .json ファイルを選んでください'); }
});

function buildSVG(scale) {
  const bb = measureBBox(); if (!bb) return null;
  const m = EX.margin, sw = doc.settings.sw;
  const x = Math.floor(bb.x - m - sw), y = Math.floor(bb.y - m - sw), w = Math.ceil(bb.width + 2 * (m + sw)), h = Math.ceil(bb.height + 2 * (m + sw));
  const bg = EX.bg === 'white' ? `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#ffffff"/>` : '';
  return { w, h, svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${w * scale}" height="${h * scale}" viewBox="${x} ${y} ${w} ${h}">${bg}${renderContent(false)}</svg>` };
}
const svgURL = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes) { let c = 0xffffffff; for (const b of bytes) c = CRC[(c ^ b) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
/* Write a pHYs chunk so Word places a 2× image at its intended physical size. */
async function withDPI(blob, dpi) {
  const buf = new Uint8Array(await blob.arrayBuffer());
  const type = String.fromCharCode(...buf.slice(37, 41));
  if (type === 'pHYs') return blob;
  const ppm = Math.round(dpi / 0.0254), chunk = new Uint8Array(21), dv = new DataView(chunk.buffer);
  dv.setUint32(0, 9); chunk.set([0x70, 0x48, 0x59, 0x73], 4); dv.setUint32(8, ppm); dv.setUint32(12, ppm); chunk[16] = 1;
  dv.setUint32(17, crc32(chunk.slice(4, 17)));
  const out = new Uint8Array(buf.length + 21); out.set(buf.slice(0, 33)); out.set(chunk, 33); out.set(buf.slice(33), 54);
  return new Blob([out], { type: 'image/png' });
}
async function svgToPng(svgStr, w, h, dpi) {
  const img = new Image(); img.src = svgURL(svgStr); await img.decode();
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(img, 0, 0, w, h);
  const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
  return withDPI(blob, dpi);
}
async function pngBlob() {
  const r = buildSVG(EX.scale); if (!r) throw new Error('empty');
  return svgToPng(r.svg, r.w * EX.scale, r.h * EX.scale, 96 * EX.scale);
}
const EX_OPTS = { bg: [['white', '白'], ['clear', '透明']], scale: [[1, '1×'], [2, '2×'], [3, '3×'], [4, '4×']], margin: [[8, '狭い'], [20, '標準'], [40, '広い']] };
function renderExport() {
  document.querySelectorAll('[data-ex]').forEach(g => { const k = g.dataset.ex; g.innerHTML = EX_OPTS[k].map(([v, l]) => `<button type="button" class="seg-btn" data-val="${v}" aria-pressed="${String(EX[k]) === String(v)}">${l}</button>`).join(''); });
  const r = buildSVG(1);
  $('#ex-preview').classList.toggle('clear', EX.bg === 'clear');
  if (!r) { $('#ex-img').removeAttribute('src'); $('#ex-size').textContent = '回路図が空です。部品を配置してから書き出してください。'; return; }
  $('#ex-img').src = svgURL(r.svg);
  const mm = v => Math.round(v / 96 * 25.4);
  $('#ex-size').textContent = `PNG ${r.w * EX.scale} × ${r.h * EX.scale} px ・ Word 上で約 ${mm(r.w)} × ${mm(r.h)} mm`;
}
function openExport() { if (draft) finishWire(); renderExport(); $('#export-modal').hidden = false; $('#ex-png').focus(); }
function closeExport() { $('#export-modal').hidden = true; }
document.querySelector('.ex-opts').addEventListener('click', e => {
  const b = e.target.closest('.seg-btn'); if (!b) return;
  const k = b.parentElement.dataset.ex, raw = b.dataset.val; EX[k] = isNaN(+raw) ? raw : +raw; renderExport();
});
$('#ex-close').addEventListener('click', closeExport);
$('#export-modal').addEventListener('pointerdown', e => { if (e.target.id === 'export-modal') closeExport(); });
$('#ex-png').addEventListener('click', async () => {
  try { const b = await pngBlob(); saveFile(`${fileBase()}.png`, b); } catch (_) { toast('回路図が空です'); }
});
$('#ex-svg').addEventListener('click', () => { const r = buildSVG(1); if (!r) { toast('回路図が空です'); return; } saveFile(`${fileBase()}.svg`, `<?xml version="1.0" encoding="UTF-8"?>\n` + r.svg); });
$('#ex-copy').addEventListener('click', () => {
  if (!doc.comps.length && !doc.wires.length && !doc.texts.length) { toast('回路図が空です'); return; }
  try {
    if (!navigator.clipboard || typeof ClipboardItem === 'undefined') throw new Error('nosupport');
    navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob() })])
      .then(() => toast('画像をコピーしました。Word に貼り付けできます'), () => toast('この環境では画像をコピーできません。PNG で保存してください'));
  } catch (_) { toast('この環境では画像をコピーできません。PNG で保存してください'); }
});

function askNew() { $('#confirm-modal').hidden = false; $('#cf-cancel').focus(); }
$('#cf-cancel').addEventListener('click', () => { $('#confirm-modal').hidden = true; });
$('#confirm-modal').addEventListener('pointerdown', e => { if (e.target.id === 'confirm-modal') $('#confirm-modal').hidden = true; });
$('#cf-ok').addEventListener('click', () => {
  $('#confirm-modal').hidden = true; doc = blankDoc(); sel.clear(); draft = null; clearSim(); setTool('select'); commit(); renderPalette(); syncTitle();
  const r = svg.getBoundingClientRect(); view = { x: Math.round(r.width / 2 / G) * G, y: Math.round(r.height / 2 / G) * G, k: 1 }; applyView();
  toast('新しい回路図を作成しました');
});

let toastTimer = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }

/* ================= wiring UI ================= */
function syncTitle() { const a = $('#doc-title'); if (document.activeElement !== a) a.value = doc.title; const b = $('#s-title'); if (b && document.activeElement !== b) b.value = doc.title; }
$('#doc-title').addEventListener('input', e => { doc.title = e.target.value; syncTitle(); persistSoon(); });
$('#doc-title').addEventListener('change', () => commit({ props: false }));
$('#doc-title').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#part-search').addEventListener('input', renderPalette);
$('#palette').addEventListener('click', e => {
  const b = e.target.closest('.pal-item'); if (!b) return;
  const t = b.dataset.type;
  if (tool === 'place' && placeType === t) { setTool('select'); return; }
  if (placeType !== t) ghost.flip = false;
  setTool('place', t);
  if (isNarrow()) $('#side-left').classList.remove('open');
});
document.querySelectorAll('.tbtn[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
$('#btn-finish').addEventListener('click', finishWire);
$('#btn-run').addEventListener('click', () => runSim());
$('#btn-undo').addEventListener('click', undo);
$('#btn-redo').addEventListener('click', redo);
$('#btn-zin').addEventListener('click', () => zoomCenter(1.25));
$('#btn-zout').addEventListener('click', () => zoomCenter(1 / 1.25));
$('#zoom-label').addEventListener('click', () => zoomCenter(1 / view.k));
$('#btn-fit').addEventListener('click', fit);
$('#btn-new').addEventListener('click', askNew);
$('#btn-open').addEventListener('click', () => $('#file-input').click());
$('#btn-save').addEventListener('click', saveJSON);
$('#btn-export').addEventListener('click', openExport);
$('#btn-parts').addEventListener('click', () => { $('#side-right').classList.remove('open'); $('#side-left').classList.toggle('open'); });
$('#btn-props').addEventListener('click', () => { $('#side-left').classList.remove('open'); $('#side-right').classList.toggle('open'); });
window.addEventListener('resize', () => renderOverlay());

/* ================= boot ================= */
(function boot() {
  let saved = null;
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) saved = JSON.parse(raw); } catch (_) {}
  const isSample = !(saved && Array.isArray(saved.comps));
  doc = isSample ? sampleDoc() : normalize(saved);
  hist = [JSON.stringify(doc)]; hi = 0;
  syncTitle(); renderPalette(); renderCanvas(); renderProps(); updateUndo(); setTool('select');
  if (isSample) { doc.sim.an = 'op'; runSim({ silent: true }); setRtab('sim'); }
  requestAnimationFrame(() => requestAnimationFrame(fit));
})();
})();
</script>
